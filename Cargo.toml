[workspace]
resolver = "2"
members = [
    "crates/nimony-lsp",
    "crates/zed-nimony",
]

[workspace.dependencies]
lsp-server = "0.7"
lsp-types = "0.95"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
similar = "2.4"
regex = "1.10"
tempfile = "3.10"
zed_extension_api = "0.7.0"
